server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Try to serve the actual file first (for SSG generated static files)
    # If it's a directory, look for index.html inside
    # Otherwise fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache static assets (images, fonts, videos)
    location ~* \.(png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache JavaScript and CSS with versioning
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

